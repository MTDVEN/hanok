<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crew — clip to sprite strips</title>
<!--
  THE CREW PIPELINE, STEP 2 OF 2 — a clip becomes sprite strips.

  Open on the dev server (node tools/serve.js):
    /tools/crew.html?v=art/crew/_work/<clip>.mp4&name=<out>&figs=4

  Step 1 happens on OpenArt: a still of the cast on flat chroma green,
  animated by an image-to-video model with THE SAME STILL AS FIRST AND
  LAST FRAME, so the clip ends where it began and loops without a seam.
  This page does the rest, because Chrome is the only thing on this
  machine that can decode video (no ffmpeg, no python):

    1. steps through the clip at `fps` and pulls every frame
    2. keys the green out — alpha from how much greener a pixel is than
       its red and blue, with the green spill clamped off the edges
    3. finds the figures by the EMPTY COLUMNS between them, over the
       union of all frames, so a figure's box never jitters
    4. packs each figure into a one-row strip at height `h`, and POSTs
       <out>-<i>.webp plus <out>.json (the manifest crew.js reads) into
       art/crew/, and a QA contact sheet into art/crew/_work/

  Params: v (clip) · name (output stem) · figs (expected figures) ·
  fps (sampling, default 12) · h (strip height in px, default 120) ·
  lo/hi (key ramp on the 0-255 greenness, default 24/70) · save=0 to
  look without writing.
-->
<style>
  body{ margin: 0; padding: 16px; background: #1b1814; color: #EBDDB9; font: 13px/1.5 ui-monospace, monospace; }
  #log{ white-space: pre-wrap; }
  .row{ display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0; }
  .cell{ padding: 10px; }
  .cell--paper{ background: #DFCEA5; }
  .cell--magenta{ background: #ff00ff; }
  .fig{ display: block; }
</style>
</head>
<body>
<div id="log"></div>
<div class="row" id="previews"></div>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script>
/* Demux with mp4box.js, decode with WebCodecs. Every frame is counted
   in presentation order (which is the order VideoDecoder emits), every
   step-th one is kept as an ImageBitmap and the rest are closed on
   arrival, so a 5 s 720p clip holds ~60 frames, not 120. */
function codecDescription(file, track){
  var DS = window.DataStream || MP4Box.DataStream;
  var entries = file.getTrackById(track.id).mdia.minf.stbl.stsd.entries;
  for (var i = 0; i < entries.length; i++){
    var box = entries[i].avcC || entries[i].hvcC || entries[i].vpcC || entries[i].av1C;
    if (box){
      var ds = new DS(undefined, 0, DS.BIG_ENDIAN);
      box.write(ds);
      return new Uint8Array(ds.buffer, 8);           // drop the box header
    }
  }
}
function decodeAll(buf, wantFps){
  return new Promise(function(resolve, reject){
    var file = MP4Box.createFile(), out = { frames: [], total: 0, step: 1 },
        pending = [], fed = 0, want = 0;
    var dec = new VideoDecoder({
      output: function(frame){
        var k = out.total++;
        if (k % out.step !== 0){ frame.close(); return; }
        pending.push(createImageBitmap(frame).then(function(bm){
          out.frames.push({ k: k, bitmap: bm });
        }).finally(function(){ frame.close(); }));
      },
      error: reject
    });
    function finish(){
      dec.flush().then(function(){ return Promise.all(pending); }).then(function(){
        out.frames.sort(function(a, b){ return a.k - b.k; });
        resolve(out);
      }, reject);
    }
    file.onError = reject;
    file.onReady = function(info){
      var tr = info.videoTracks[0];
      if (!tr) return reject(new Error("no video track"));
      out.w = tr.video.width; out.h = tr.video.height;
      out.fps = tr.nb_samples / (tr.duration / tr.timescale);
      out.step = Math.max(1, Math.round(out.fps / wantFps));
      want = tr.nb_samples;
      dec.configure({ codec: tr.codec, codedWidth: out.w, codedHeight: out.h,
                      description: codecDescription(file, tr) });
      file.setExtractionOptions(tr.id, null, { nbSamples: Infinity });
      file.start();
    };
    file.onSamples = function(id, user, samples){
      samples.forEach(function(s){
        dec.decode(new EncodedVideoChunk({
          type: s.is_sync ? "key" : "delta",
          timestamp: 1e6 * s.cts / s.timescale,
          duration: 1e6 * s.duration / s.timescale,
          data: s.data
        }));
      });
      fed += samples.length;
      if (fed >= want) finish();
    };
    buf.fileStart = 0;
    file.appendBuffer(buf);
    file.flush();
  });
}

(async function(){
  "use strict";
  var Q = new URLSearchParams(location.search);
  var SRC  = Q.get("v"),
      NAME = Q.get("name") || "crew",
      FIGS = +(Q.get("figs") || 4),
      FPS  = +(Q.get("fps") || 12),
      H    = +(Q.get("h") || 120),
      /* k: instead of one height for every figure, keep them at ONE
         SCALE — strip px per clip px — so a ladder stays taller than
         the kneeling worker beside it. Overrides h when given. */
      KSC  = Q.get("k") ? +Q.get("k") : 0,
      /* q: WebP quality. 0.8 is ~40% lighter than 0.9 and at strip
         sizes the difference does not show; 0.9 was the first cut. */
      QUAL = Q.get("q") ? +Q.get("q") : 0.8,
      LO   = +(Q.get("lo") || 24),
      HI   = +(Q.get("hi") || 70),
      /* where the invisible ledge they sit on is, as a fraction of the
         clip's height — read off the still, where the hems fold flat.
         Written per figure into the manifest as `seat`, the fraction
         of that figure's strip where it meets the letter it sits on. */
      SEATY = +(Q.get("seat") || 0.582),
      /* surf=blue: the still carries a flat pure-BLUE (#0000FF) block
         standing in for the letter a figure works on (the ladder leans
         on it, a tile is laid on it, someone kneels on it), so the
         model draws real contact instead of a tile in mid-air. Blue is
         keyed out like the green, and the block's box in frame 0 is
         written to the manifest per figure ('blue', fractions of that
         figure's strip) — its top edge is the letter's top edge. */
      SURF = Q.get("surf") === "blue",
      /* oneshot=1: an action clip whose first and last frames DIFFER
         (a carrier setting tiles down). Keep every frame, the last one
         included: it is what the next strip has to match. */
      ONESHOT = Q.get("oneshot") === "1",
      /* stage=<name>: the PAINTERS (tools/paintstage.js). Their clip is
         Zico's real lettering with the crew painted onto it, so the
         letters have to come OUT — and they cannot be keyed: they are
         ink, and so is every painter's linework. They are lifted by their
         own outlines instead: js/title-zico.js's `all`, laid over frame 0
         where art/crew/<name>.stage.json says the still's frame put it,
         nudged (shift and scale, per axis) until it sits on the frame's
         dark pixels, grown by `dil` px — and inside it, anything darker
         than `ink` goes. A painter's tan clothes, skin and wooden brush
         stay, in front of the letter; the brush's black tip on the letter
         goes, and the page's own letter shows there. The frame's place in
         the title (`view`, svg units) goes into the manifest. */
      STAGE = Q.get("stage"),
      DIL  = +(Q.get("dil") || 4),
      INKL = +(Q.get("ink") || 100),
      /* sep=cc: figures are the connected shapes left over (grown by `grp`
         px so a brush tip parted from its hand stays with it), not the
         column groups — a painter on a letter and one on the ground below
         can share columns. The default with stage= */
      SEP  = Q.get("sep") || (STAGE ? "cc" : "cols"),
      GRP  = +(Q.get("grp") || 8),
      /* dump=0,15,30: those frames as they came out of the decoder (before
         any keying) → art/crew/_work/<name>-f<k>.png, to see what the video
         model actually did */
      DUMP = (Q.get("dump") || "").split(",").filter(Boolean).map(Number),
      SAVE = Q.get("save") !== "0";
  var logEl = document.getElementById("log");
  function log(s){ logEl.textContent += s + "\n"; }
  window.CREW = { state: "running" };

  if (!SRC){ log("need ?v=<clip>"); window.CREW.state = "error"; return; }

  /* DECODED WITH WEBCODECS, NOT A <video>. The MCP's Chrome tab is a
     hidden tab, and Chrome DEFERS MEDIA LOADING in hidden tabs — the
     element sat at readyState 0 forever (2026-09-30). VideoDecoder has
     no such gate, so: fetch the bytes, demux with mp4box.js, decode
     every sample, keep every (24/fps)-th frame. */
  var buf = await (await fetch("../" + SRC.replace(/^\//, ""))).arrayBuffer();
  var decoded = await decodeAll(buf, FPS);     // every step-th frame, presentation order
  var W = decoded.w, VH = decoded.h, step = decoded.step;
  var picks = decoded.frames;
  /* the clip ENDS on the frame it began with (same still as first and
     last frame), so a sample landing on the very end is frame 0 again:
     drop it, or the loop holds one frame twice */
  if (!ONESHOT && (decoded.total - 1) % step === 0 && picks.length > 2) picks.pop().bitmap.close();
  var N = picks.length, OUT_FPS = decoded.fps / step;
  log("clip " + W + "x" + VH + " @" + decoded.fps.toFixed(2) + "fps, " + decoded.total +
      " frames -> " + N + " at " + OUT_FPS.toFixed(2) + "fps");

  var work = document.createElement("canvas");
  work.width = W; work.height = VH;
  var wx = work.getContext("2d", { willReadFrequently: true });

  /* ---- stage=: find the lettering in frame 0, and the mask that lifts it */
  var LETTERS = null, VIEW = null, REG = null;
  if (STAGE){
    var stg = await (await fetch("../art/crew/" + STAGE + ".stage.json")).json();
    var zsrc = await (await fetch("../js/title-zico.js")).text(), zw = {};
    new Function("window", zsrc)(zw);
    var ALL = new Path2D(zw.HANOK_TITLE.all);
    wx.drawImage(picks[0].bitmap, 0, 0, W, VH);
    var f0 = wx.getImageData(0, 0, W, VH).data;
    /* frame 0's dark pixels, at full size and at 1/4 */
    var D4 = 4, w4 = Math.floor(W / D4), h4 = Math.floor(VH / D4), dark = new Uint8Array(W * VH), dark4 = new Uint8Array(w4 * h4), nd = 0, nd4 = 0;
    for (var q0 = 0; q0 < W * VH; q0++){
      var lu = 0.299 * f0[q0 * 4] + 0.587 * f0[q0 * 4 + 1] + 0.114 * f0[q0 * 4 + 2];
      if (lu < 90){ dark[q0] = 1; nd++; }
    }
    for (var y4 = 0; y4 < h4; y4++) for (var x4 = 0; x4 < w4; x4++){
      var c4 = 0; for (var dy4 = 0; dy4 < D4; dy4++) for (var dx4 = 0; dx4 < D4; dx4++) c4 += dark[(y4 * D4 + dy4) * W + x4 * D4 + dx4];
      if (c4 * 2 >= D4 * D4){ dark4[y4 * w4 + x4] = 1; nd4++; }
    }
    /* the outlines as a pixel list at transform x' = x·sx + ox (px of a
       canvas `k` times the clip's size) */
    var cvL = document.createElement("canvas"), cxL = cvL.getContext("2d", { willReadFrequently: true });
    function letterPx(k, sx, sy){
      var w = Math.floor(W * k), h = Math.floor(VH * k);
      cvL.width = w; cvL.height = h;
      cxL.setTransform(sx * k, 0, 0, sy * k, -stg.view[0] * sx * k, -stg.view[1] * sy * k);
      cxL.fillStyle = "#000"; cxL.fill(ALL, "evenodd");
      var dd = cxL.getImageData(0, 0, w, h).data, out = [];
      for (var q1 = 0; q1 < w * h; q1++) if (dd[q1 * 4 + 3] > 127) out.push(q1 % w, (q1 / w) | 0);
      return out;
    }
    function iou(list, dm, dw, dh, ndk, ox, oy){
      var inter = 0;
      for (var j = 0; j < list.length; j += 2){
        var xx = list[j] + ox, yy = list[j + 1] + oy;
        if (xx >= 0 && yy >= 0 && xx < dw && yy < dh) inter += dm[yy * dw + xx];
      }
      return inter / Math.max(1, list.length / 2 + ndk - inter);
    }
    /* coarse: scale ±1% per axis, shift ±16px, at 1/4; then fine at full
       size around the best. The still's 43:24 frame becomes 16:9 video by
       a stretch or a crop — this finds whichever it was */
    var SX0 = W / stg.view[2], SY0 = VH / stg.view[3], best = { v: -1 };
    for (var fx = -4; fx <= 4; fx++) for (var fy = -4; fy <= 4; fy++){
      var sx1 = SX0 * (1 + fx * 0.0025), sy1 = SY0 * (1 + fy * 0.0025), L4 = letterPx(1 / D4, sx1, sy1);
      for (var oy1 = -4; oy1 <= 4; oy1++) for (var ox1 = -4; ox1 <= 4; ox1++){
        var v1 = iou(L4, dark4, w4, h4, nd4, ox1, oy1);
        if (v1 > best.v) best = { v: v1, fx: fx, fy: fy, ox: ox1 * D4, oy: oy1 * D4 };
      }
    }
    var fine = { v: -1 };
    for (var gx = best.fx - 1; gx <= best.fx + 1; gx++) for (var gy = best.fy - 1; gy <= best.fy + 1; gy++){
      var sx2 = SX0 * (1 + gx * 0.0025), sy2 = SY0 * (1 + gy * 0.0025), L1 = letterPx(1, sx2, sy2);
      for (var oy2 = best.oy - 3; oy2 <= best.oy + 3; oy2++) for (var ox2 = best.ox - 3; ox2 <= best.ox + 3; ox2++){
        var v2 = iou(L1, dark, W, VH, nd, ox2, oy2);
        if (v2 > fine.v) fine = { v: v2, sx: sx2, sy: sy2, ox: ox2, oy: oy2 };
      }
    }
    REG = fine;
    /* the frame's rectangle of the title, in svg units: pixel x is svg
       view[0] + x / sx, with the shift folded in */
    VIEW = [stg.view[0] - fine.ox / fine.sx, stg.view[1] - fine.oy / fine.sy, W / fine.sx, VH / fine.sy];
    log("letters found in frame 0: IoU " + fine.v.toFixed(3) + ", scale " + (fine.sx / SX0).toFixed(4) + " x " + (fine.sy / SY0).toFixed(4) +
        ", shift " + fine.ox + "," + fine.oy + " px  -> view " + VIEW.map(function(n){ return n.toFixed(2); }).join(", "));
    if (fine.v < 0.7) log("!! the letters do not sit where the stage says — check the clip");
    /* the mask: the outlines at that transform, grown DIL px */
    cvL.width = W; cvL.height = VH;
    cxL.setTransform(fine.sx, 0, 0, fine.sy, -VIEW[0] * fine.sx, -VIEW[1] * fine.sy);
    cxL.fillStyle = "#000"; cxL.fill(ALL, "evenodd");
    var ml = cxL.getImageData(0, 0, W, VH).data;
    LETTERS = new Uint8Array(W * VH);
    for (var q2 = 0; q2 < W * VH; q2++) LETTERS[q2] = ml[q2 * 4 + 3] > 60 ? 1 : 0;
    for (var pass = 0; pass < DIL; pass++){
      var grown = LETTERS.slice();
      for (var yy2 = 1; yy2 < VH - 1; yy2++) for (var xx2 = 1; xx2 < W - 1; xx2++){
        var o2 = yy2 * W + xx2;
        if (!LETTERS[o2] && (LETTERS[o2 - 1] || LETTERS[o2 + 1] || LETTERS[o2 - W] || LETTERS[o2 + W] ||
            (pass % 2 && (LETTERS[o2 - W - 1] || LETTERS[o2 - W + 1] || LETTERS[o2 + W - 1] || LETTERS[o2 + W + 1])))) grown[o2] = 1;
      }
      LETTERS = grown;
    }
  }

  /* ---- 1+2: pull and key every frame ---------------------------- */
  var frames = [], colHit = new Uint32Array(W), prevSum = -1, same = 0;
  /* frame 0's strongly-blue pixels, before keying: where the surface is */
  var blue0 = SURF ? new Uint8Array(W * VH) : null;
  for (var i = 0; i < N; i++){
    wx.clearRect(0, 0, W, VH);
    wx.drawImage(picks[i].bitmap, 0, 0, W, VH);
    picks[i].bitmap.close();
    if (DUMP.indexOf(i) >= 0){
      var raw = await new Promise(function(ok){ work.toBlob(ok, "image/png"); });
      await fetch("/art/crew/_work/" + NAME + "-f" + i + ".png", { method: "POST", body: raw });
      log("  dumped frame " + i);
    }
    var img = wx.getImageData(0, 0, W, VH), d = img.data, sum = 0;
    for (var p = 0; p < d.length; p += 4){
      var r = d[p], g = d[p + 1], b = d[p + 2];
      var mx = r > b ? r : b, gn = g - mx;               // greenness
      var a = gn <= LO ? 1 : gn >= HI ? 0 : 1 - (gn - LO) / (HI - LO);
      if (SURF){
        /* the blue surface, keyed the same way; and a pixel bluer than
           its red and green (grey tile edge against the block) has its
           blue pulled back to their mean, the green despill's twin */
        var mrg = r > g ? r : g, bn = b - mrg;
        var ab = bn <= LO ? 1 : bn >= HI ? 0 : 1 - (bn - LO) / (HI - LO);
        if (i === 0 && bn >= HI) blue0[p >> 2] = 1;
        if (ab < a) a = ab;
        if (b > mrg){ d[p + 2] = (r + g) >> 1; b = d[p + 2]; mx = r > b ? r : b; }
      }
      /* despill: a pixel greener than both its red and blue took green
         from the screen (motion blur on a swinging foot, bounce light).
         Clamping G to max(R,B) left skin YELLOW — (R,R,B) — so G goes
         to the mean of R and B instead, which puts it back to the
         warm tan/skin these figures are made of. */
      if (g > mx) d[p + 1] = (r + b) >> 1;
      /* MAGENTA is H.264 chroma ringing (its overshoot past green goes
         the other way), never paint: these figures are warm tan, skin,
         warm-grey tile and ink. A pixel clearly redder AND bluer than
         it is green is recoloured to the figures' own warm chroma at
         the same brightness (drop-m, 2026-09-30: pink legs in its first
         frames, up to 2% of a frame). */
      var g2 = d[p + 1];
      if (r - g2 > 10 && b - g2 > 10){
        var Y = 0.299 * r + 0.587 * g2 + 0.114 * b;
        d[p]     = Math.max(0, Math.min(255, Math.round(Y + 18)));
        d[p + 1] = Math.max(0, Math.min(255, Math.round(Y - 3)));
        d[p + 2] = Math.max(0, Math.min(255, Math.round(Y - 28)));
      }
      /* stage=: the lettering goes (after the despill, so its dark-green
         anti-aliased edge reads as the ink it is) */
      if (LETTERS && LETTERS[p >> 2] && 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2] < INKL) a = 0;
      d[p + 3] = Math.round(a * 255);
      sum += d[p + 3];
    }
    /* EDGE despill, the second half. H.264 stores colour at half
       resolution, so where tan or skin meets the green screen the
       chroma averages into YELLOW — pixels that are not greener than
       their red (the rule above never sees them) and are fully opaque.
       Only within 2px of a transparent pixel, pull G down to the mean
       of R and B; everywhere else the washes keep their own green. */
    var A = new Uint8Array(W * VH);
    for (var q = 0, n = 3; q < A.length; q++, n += 4) A[q] = d[n];
    for (var y = 2; y < VH - 2; y++) for (var x = 2; x < W - 2; x++){
      var o = y * W + x;
      if (!A[o]) continue;
      if (A[o - 2] > 200 && A[o + 2] > 200 && A[o - 2 * W] > 200 && A[o + 2 * W] > 200 &&
          A[o - W - 1] > 200 && A[o - W + 1] > 200 && A[o + W - 1] > 200 && A[o + W + 1] > 200) continue;
      var pp = o * 4, mean = (d[pp] + d[pp + 2]) >> 1;
      if (d[pp + 1] > mean) d[pp + 1] = mean;
      if (SURF){ var mrg2 = (d[pp] + d[pp + 1]) >> 1; if (d[pp + 2] > mrg2 + 8) d[pp + 2] = mrg2 + 8; }
    }
    /* a decoder that stopped updating (a backgrounded tab can do this)
       hands back the same frame again and again — say so loudly */
    if (sum === prevSum) same++;
    prevSum = sum;
    frames.push(img);
    if (i % 12 === 0) log("  frame " + i + "/" + N);
  }
  if (same > N / 4) log("!! " + same + " frames identical to the one before — decoder stalled?");

  /* ---- 3: find the figures by empty columns over ALL frames ------ */
  var rowHit = new Uint32Array(VH);
  frames.forEach(function(img){
    var d = img.data;
    for (var y = 0; y < VH; y++) for (var x = 0; x < W; x++){
      if (d[(y * W + x) * 4 + 3] > 40){ colHit[x]++; rowHit[y]++; }
    }
  });
  /* a column counts as occupied if at least a few pixels are, summed
     over the clip — a lone speck of compression noise is not a figure */
  var segs = [], inSeg = false, s0 = 0, MINCOL = 3;
  for (var x = 0; x <= W; x++){
    var on = x < W && colHit[x] >= MINCOL;
    if (on && !inSeg){ inSeg = true; s0 = x; }
    if (!on && inSeg){ inSeg = false; segs.push([s0, x - 1]); }
  }
  /* drop slivers (narrower than 2% of the frame): noise, not people */
  segs = segs.filter(function(s){ return s[1] - s[0] > W * 0.02; });
  /* more column groups than figures asked for: keep the FIGS heaviest
     (most occupied pixels over the clip) and say what was dropped — a
     smudge the model left on the floor for a few frames is not a
     figure (drop-w, 2026-09-30: two 12x4px specks beside the pile) */
  if (segs.length > FIGS){
    var mass = function(sg){ var m = 0; for (var x = sg[0]; x <= sg[1]; x++) m += colHit[x]; return m; };
    var ranked = segs.slice().sort(function(p, q){ return mass(q) - mass(p); });
    var keep = ranked.slice(0, FIGS);
    ranked.slice(FIGS).forEach(function(sg){ log("  dropped column group " + sg[0] + "-" + sg[1] + " (mass " + mass(sg) + ")"); });
    segs = segs.filter(function(sg){ return keep.indexOf(sg) >= 0; });
  }
  log("found " + segs.length + " figure column(s): " + segs.map(function(s){ return s[0] + "-" + s[1]; }).join(", "));
  if (segs.length !== FIGS) log("!! expected " + FIGS + " figures — check the key (lo/hi) or the clip");

  /* per figure: vertical extent inside its own columns, over all frames */
  var figs = segs.map(function(s){
    var y0 = VH, y1 = -1;
    frames.forEach(function(img){
      var d = img.data;
      for (var y = 0; y < VH; y++){
        for (var x = s[0]; x <= s[1]; x++){
          if (d[(y * W + x) * 4 + 3] > 40){ if (y < y0) y0 = y; if (y > y1) y1 = y; break; }
        }
      }
    });
    var pad = 2;
    return { x0: Math.max(0, s[0] - pad), x1: Math.min(W - 1, s[1] + pad),
             y0: Math.max(0, y0 - pad), y1: Math.min(VH - 1, y1 + pad) };
  });

  /* sep=cc: the figures are the connected shapes of the clip instead —
     every pixel seen in any frame, grown GRP px, labelled; the FIGS
     biggest are the figures, left to right. Each strip then keeps only
     its own shape's pixels, so a neighbour never bleeds into its box. */
  var lab = null;
  if (SEP === "cc"){
    var U = new Uint8Array(W * VH), G1 = new Uint8Array(W * VH), G2 = new Uint8Array(W * VH);
    frames.forEach(function(img){ var d = img.data; for (var q3 = 0; q3 < W * VH; q3++) if (d[q3 * 4 + 3] > 40) U[q3] = 1; });
    for (var y3 = 0; y3 < VH; y3++){
      for (var x3 = 0, lastOn = -1e9; x3 < W; x3++){ if (U[y3 * W + x3]) lastOn = x3; if (x3 - lastOn <= GRP) G1[y3 * W + x3] = 1; }
      for (x3 = W - 1, lastOn = 1e9; x3 >= 0; x3--){ if (U[y3 * W + x3]) lastOn = x3; if (lastOn - x3 <= GRP) G1[y3 * W + x3] = 1; }
    }
    for (var x5 = 0; x5 < W; x5++){
      for (var y5 = 0, lastOn2 = -1e9; y5 < VH; y5++){ if (G1[y5 * W + x5]) lastOn2 = y5; if (y5 - lastOn2 <= GRP) G2[y5 * W + x5] = 1; }
      for (y5 = VH - 1, lastOn2 = 1e9; y5 >= 0; y5--){ if (G1[y5 * W + x5]) lastOn2 = y5; if (lastOn2 - y5 <= GRP) G2[y5 * W + x5] = 1; }
    }
    lab = new Int32Array(W * VH);
    var comps = [];
    for (var q4 = 0; q4 < W * VH; q4++){
      if (!G2[q4] || lab[q4]) continue;
      var cid = comps.length + 1, stack = [q4], cc = { id: cid, n: 0, x0: W, y0: VH, x1: -1, y1: -1 };
      lab[q4] = cid;
      while (stack.length){
        var p4 = stack.pop(), px4 = p4 % W, py4 = (p4 / W) | 0;
        if (U[p4]){ cc.n++; if (px4 < cc.x0) cc.x0 = px4; if (px4 > cc.x1) cc.x1 = px4; if (py4 < cc.y0) cc.y0 = py4; if (py4 > cc.y1) cc.y1 = py4; }
        if (px4 > 0 && G2[p4 - 1] && !lab[p4 - 1]){ lab[p4 - 1] = cid; stack.push(p4 - 1); }
        if (px4 < W - 1 && G2[p4 + 1] && !lab[p4 + 1]){ lab[p4 + 1] = cid; stack.push(p4 + 1); }
        if (py4 > 0 && G2[p4 - W] && !lab[p4 - W]){ lab[p4 - W] = cid; stack.push(p4 - W); }
        if (py4 < VH - 1 && G2[p4 + W] && !lab[p4 + W]){ lab[p4 + W] = cid; stack.push(p4 + W); }
      }
      comps.push(cc);
    }
    comps = comps.filter(function(c){ return c.n > 0; }).sort(function(a, b){ return b.n - a.n; });
    comps.slice(FIGS).forEach(function(c){ log("  dropped shape at " + c.x0 + "," + c.y0 + " " + (c.x1 - c.x0 + 1) + "x" + (c.y1 - c.y0 + 1) + " (" + c.n + " px over the clip)"); });
    comps = comps.slice(0, FIGS).sort(function(a, b){ return (a.x0 + a.x1) - (b.x0 + b.x1); });
    log("found " + comps.length + " figure shape(s): " + comps.map(function(c){ return c.x0 + "," + c.y0 + " " + (c.x1 - c.x0 + 1) + "x" + (c.y1 - c.y0 + 1); }).join(" | "));
    if (comps.length !== FIGS) log("!! expected " + FIGS + " figures — check the key, the stage mask or the clip");
    figs = comps.map(function(c){
      var pad = 2;
      return { x0: Math.max(0, c.x0 - pad), x1: Math.min(W - 1, c.x1 + pad), y0: Math.max(0, c.y0 - pad), y1: Math.min(VH - 1, c.y1 + pad), label: c.id };
    });
  }

  /* ---- 4: pack one strip per figure ----------------------------- */
  var keyed = document.createElement("canvas");
  keyed.width = W; keyed.height = VH;
  var kx = keyed.getContext("2d");
  var manifest = { clip: SRC, fps: +OUT_FPS.toFixed(3), frames: N, h: KSC ? null : H, k: KSC || null,
                   frameW: W, frameH: VH, oneshot: ONESHOT || undefined, figures: [] };
  /* stage=: the frame's rectangle of the title (svg units) — js/crew.js
     puts every figure back where it was painted: view[0] + box[0]·view[2] … */
  if (VIEW){
    manifest.view = VIEW.map(function(n){ return +n.toFixed(3); });
    manifest.stage = { name: STAGE, iou: +REG.v.toFixed(3), dil: DIL, ink: INKL };
  }

  /* the blue block(s) of frame 0, as one bounding box per figure: the
     strongly-blue pixels in the columns of that figure's segment plus a
     margin either side (a ladder's wall stands just right of it) */
  function blueBox(b){
    if (!SURF) return null;
    var mX = Math.round((b.x1 - b.x0) * 0.6), X0 = Math.max(0, b.x0 - mX), X1 = Math.min(W - 1, b.x1 + mX);
    var bx0 = W, by0 = VH, bx1 = -1, by1 = -1, cnt = 0;
    for (var y = 0; y < VH; y++) for (var x = X0; x <= X1; x++){
      if (!blue0[y * W + x]) continue;
      cnt++; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
    }
    if (cnt < 200) return null;
    /* the TOP EDGE is where the block's columns first turn blue — a
       median over its middle half, so a tile resting on it (which hides
       the blue below) or a shaded corner cannot drag it up or down */
    var tops = [];
    for (var x2 = bx0 + Math.round((bx1 - bx0) * 0.25); x2 <= bx0 + Math.round((bx1 - bx0) * 0.75); x2++){
      for (var y2 = by0; y2 <= by1; y2++) if (blue0[y2 * W + x2]){ tops.push(y2); break; }
    }
    tops.sort(function(p1, p2){ return p1 - p2; });
    var top = tops.length ? tops[tops.length >> 1] : by0;
    var bw2 = b.x1 - b.x0 + 1, bh2 = b.y1 - b.y0 + 1;
    return [ (bx0 - b.x0) / bw2, (top - b.y0) / bh2, (bx1 + 1 - b.x0) / bw2, (by1 + 1 - b.y0) / bh2 ]
      .map(function(v){ return +v.toFixed(4); });
  }
  var qaCells = [];

  for (var f = 0; f < figs.length; f++){
    var b = figs[f], bw = b.x1 - b.x0 + 1, bh = b.y1 - b.y0 + 1;
    var FH = KSC ? Math.round(bh * KSC) : H;
    var fw = Math.round(bw * FH / bh);
    var strip = document.createElement("canvas");
    strip.width = fw * N; strip.height = FH;
    var sx = strip.getContext("2d");
    sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = "high";
    if (b.label){
      /* sep=cc: only this figure's own shape */
      var tmp = document.createElement("canvas"); tmp.width = bw; tmp.height = bh;
      var tmx = tmp.getContext("2d"), tid = tmx.createImageData(bw, bh), td = tid.data;
      for (var k = 0; k < N; k++){
        var fd = frames[k].data;
        for (var yy = 0; yy < bh; yy++) for (var xx = 0; xx < bw; xx++){
          var so = (b.y0 + yy) * W + b.x0 + xx, dO = (yy * bw + xx) * 4;
          if (lab[so] === b.label){ td[dO] = fd[so * 4]; td[dO + 1] = fd[so * 4 + 1]; td[dO + 2] = fd[so * 4 + 2]; td[dO + 3] = fd[so * 4 + 3]; }
          else td[dO + 3] = 0;
        }
        tmx.putImageData(tid, 0, 0);
        sx.drawImage(tmp, 0, 0, bw, bh, k * fw, 0, fw, FH);
      }
    } else for (var k = 0; k < N; k++){
      kx.putImageData(frames[k], 0, 0);
      sx.drawImage(keyed, b.x0, b.y0, bw, bh, k * fw, 0, fw, FH);
    }
    var file = NAME + "-" + (f + 1) + ".webp";
    manifest.figures.push({ file: file, w: fw, h: FH,
      seat: STAGE ? undefined : +((SEATY * VH - b.y0) / bh).toFixed(4),
      blue: blueBox(b) || undefined,
      /* where the figure sits in the clip, as fractions of the frame —
         crew.js does not need it, but it records the row's spacing */
      box: [b.x0 / W, b.y0 / VH, bw / W, bh / VH].map(function(n){ return +n.toFixed(4); }) });
    if (SAVE){
      var blob = await new Promise(function(ok){ strip.toBlob(ok, "image/webp", QUAL); });
      await fetch("/art/crew/" + file, { method: "POST", body: blob });
      log("saved art/crew/" + file + "  " + strip.width + "x" + FH + "  " + Math.round(blob.size / 1024) + "KB");
    }
    qaCells.push({ strip: strip, fw: fw, fh: FH });

    /* live preview on paper and on magenta (a hole shows on magenta) */
    ["paper", "magenta"].forEach(function(bg){
      var cell = document.createElement("div");
      cell.className = "cell cell--" + bg;
      var el = document.createElement("div");
      el.className = "fig";
      el.style.width = fw + "px"; el.style.height = FH + "px";
      el.style.backgroundImage = "url(" + strip.toDataURL("image/png") + ")";
      el.animate([{ backgroundPosition: "0 0" }, { backgroundPosition: (-fw * N) + "px 0" }],
                 { duration: N / OUT_FPS * 1000, iterations: Infinity, easing: "steps(" + N + ")" });
      cell.appendChild(el);
      document.getElementById("previews").appendChild(cell);
    });
  }

  /* QA contact sheet: 6 evenly spaced frames of every figure, on paper
     and on magenta, one figure per row — a still you can judge */
  var PICK = 6, pad = 8, cw = 0, chh = 0;
  qaCells.forEach(function(c){ chh = Math.max(chh, c.fh); });
  qaCells.forEach(function(c){ cw = Math.max(cw, c.fw); });
  var qa = document.createElement("canvas");
  qa.width = (cw + pad) * PICK * 2 + pad; qa.height = (chh + pad) * qaCells.length + pad;
  var qx = qa.getContext("2d");
  qx.fillStyle = "#DFCEA5"; qx.fillRect(0, 0, qa.width / 2, qa.height);
  qx.fillStyle = "#ff00ff"; qx.fillRect(qa.width / 2, 0, qa.width / 2, qa.height);
  qaCells.forEach(function(c, r){
    for (var j = 0; j < PICK; j++){
      var k = Math.round(j * (N - 1) / (PICK - 1));
      for (var side = 0; side < 2; side++){
        qx.drawImage(c.strip, k * c.fw, 0, c.fw, c.fh,
          side * qa.width / 2 + pad + j * (cw + pad), pad + r * (chh + pad), c.fw, c.fh);
      }
    }
  });
  if (SAVE){
    var qb = await new Promise(function(ok){ qa.toBlob(ok, "image/png"); });
    await fetch("/art/crew/_work/" + NAME + "-qa.png", { method: "POST", body: qb });
    await fetch("/art/crew/" + NAME + ".json", { method: "POST", body: JSON.stringify(manifest, null, 2) });
    log("saved art/crew/" + NAME + ".json and art/crew/_work/" + NAME + "-qa.png");
  }
  window.CREW = { state: "done", manifest: manifest, stalled: same };
  log("done");
})().catch(function(e){
  document.getElementById("log").textContent += "\nERROR " + (e && e.stack || e);
  window.CREW = { state: "error", error: String(e) };
});
</script>
</body>
</html>
